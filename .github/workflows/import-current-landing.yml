name: Import current Dossim landing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-current-landing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download current Vercel landing
        run: |
          curl -fSL --retry 3 https://dossim-site.vercel.app -o /tmp/dossim-source.html
          grep -q "Dossim" /tmp/dossim-source.html

      - name: Split landing into editable files
        shell: python
        run: |
          import base64
          import re
          from pathlib import Path

          source = Path('/tmp/dossim-source.html').read_text(encoding='utf-8')
          if '<title>Dossim' not in source:
              raise SystemExit('The downloaded page is not the Dossim landing page')

          style_match = re.search(r'<style>\s*(.*?)\s*</style>', source, re.S)
          script_matches = list(re.finditer(r'<script>\s*(.*?)\s*</script>', source, re.S))
          images = re.findall(r'src="data:image/png;base64,([^"]+)"', source)

          if not style_match or not script_matches or len(images) < 2:
              raise SystemExit('Could not extract CSS, JS or Marc images from the deployed page')

          css = style_match.group(1).strip() + '\n'
          js = script_matches[-1].group(1).strip() + '\n'

          html = source
          html = html[:style_match.start()] + '<link rel="stylesheet" href="styles.css" />' + html[style_match.end():]
          html = re.sub(r'src="data:image/png;base64,[^"]+"', 'src="assets/marc-hero.png"', html, count=1)
          html = re.sub(r'src="data:image/png;base64,[^"]+"', 'src="assets/marc-phone.png"', html, count=1)
          script_matches = list(re.finditer(r'<script>\s*(.*?)\s*</script>', html, re.S))
          last = script_matches[-1]
          html = html[:last.start()] + '<script src="script.js"></script>' + html[last.end():]

          Path('assets').mkdir(exist_ok=True)
          Path('assets/marc-hero.png').write_bytes(base64.b64decode(images[0]))
          Path('assets/marc-phone.png').write_bytes(base64.b64decode(images[1]))
          Path('styles.css').write_text(css, encoding='utf-8')
          Path('script.js').write_text(js, encoding='utf-8')
          Path('index.html').write_text(html, encoding='utf-8')

      - name: Commit imported landing
        run: |
          git config user.name "Dossim Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html styles.css script.js assets/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Import current Dossim landing"
          git push
